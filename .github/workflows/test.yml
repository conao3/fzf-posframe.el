name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '26.1'
          - '27.2'
          - '28.2'
          - '29.4'
          - '31.1'
          - 'snapshot'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el "$HOME/.keg"
          echo "$HOME/.keg/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test
        continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
